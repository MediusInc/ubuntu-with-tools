name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - containers.conf
      - Dockerfile
      - tests/**
      - .github/workflows/build.yml
  schedule:
    - cron: '0 3 * * *' # At 03:00 AM (UTC)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      - name: Build, smoke test and push image
        run: |
          # Ubuntu LTS versions only; add new LTS releases here
          TAGS="26.04"
          PLATFORMS="linux/amd64 linux/arm64"

          # Iterate over tags and build/test/push
          for tag in $(echo -e "${TAGS//,/\\n}" | uniq); do
              # Build each platform into the local docker image store and smoke test it.
              # Any failure stops the job before anything is pushed.
              for platform in $PLATFORMS; do
                  echo "Smoke testing mediussi/ubuntu-with-tools:$tag ($platform)"
                  docker buildx build . \
                  --platform "$platform" \
                  --build-arg "UBUNTU_VERSION=$tag" \
                  --tag "ubuntu-with-tools:smoke" \
                  --load
                  docker run --rm --privileged --platform "$platform" \
                  -v "$PWD/tests:/t" ubuntu-with-tools:smoke bash /t/smoke.sh
              done

              echo "Pushing mediussi/ubuntu-with-tools:$tag"
              # Layers come from the builder cache of the smoke-test builds above.
              # set --provenance=false to force pushing a docker manifest (not oci)
              # https://github.com/docker/buildx/issues/1509#issuecomment-1378454396
              docker buildx build . \
              --platform linux/amd64,linux/arm64 \
              --build-arg "UBUNTU_VERSION=$tag" \
              --tag "mediussi/ubuntu-with-tools:$tag" \
              --provenance=false \
              --push
          done
