name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - containers.conf
      - Dockerfile
      - tests/**
      - .github/workflows/build.yml
  schedule:
    - cron: '0 3 * * *' # At 03:00 AM (UTC)

env:
  IMAGE: mediussi/ubuntu-with-tools
  # Newest LTS in the matrix; its image is also tagged `latest`
  LATEST_UBUNTU: "26.04"

jobs:
  # Build and smoke test each platform on a native runner (no QEMU: crun cannot
  # start containers under emulation, so podman builds would fail there).
  # Each platform is pushed by digest only; the tag is created in the merge job,
  # so nothing is tagged unless every platform passed.
  build:
    strategy:
      fail-fast: true
      matrix:
        # Ubuntu LTS versions only; add new LTS releases here (and update LATEST_UBUNTU)
        ubuntu: [ "26.04" ]
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        run: |
          docker buildx build . \
            --platform "linux/${{ matrix.platform.arch }}" \
            --build-arg "UBUNTU_VERSION=${{ matrix.ubuntu }}" \
            --tag ubuntu-with-tools:smoke \
            --load

      - name: Smoke test
        run: |
          docker run --rm --privileged \
            -v "$PWD/tests:/t" ubuntu-with-tools:smoke bash /t/smoke.sh

      - name: Push image by digest
        run: |
          # Same build again: every layer comes from the builder cache.
          # oci-mediatypes=false + --provenance=false keep a plain docker manifest (not oci)
          # https://github.com/docker/buildx/issues/1509#issuecomment-1378454396
          docker buildx build . \
            --platform "linux/${{ matrix.platform.arch }}" \
            --build-arg "UBUNTU_VERSION=${{ matrix.ubuntu }}" \
            --provenance=false \
            --output "type=image,name=docker.io/${IMAGE},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=false" \
            --metadata-file metadata.json
          mkdir -p digests
          digest=$(jq -r '."containerimage.digest"' metadata.json)
          touch "digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.ubuntu }}-${{ matrix.platform.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-platform images into one multi-arch tag.
  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Keep in sync with the build job's ubuntu list
        ubuntu: [ "26.04" ]
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digests-${{ matrix.ubuntu }}-*
          path: digests
          merge-multiple: true

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push multi-arch tag
        working-directory: digests
        run: |
          test "$(ls | wc -l)" -eq 2
          tags=(--tag "${IMAGE}:${{ matrix.ubuntu }}")
          if [ "${{ matrix.ubuntu }}" = "${LATEST_UBUNTU}" ]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${{ matrix.ubuntu }}"
